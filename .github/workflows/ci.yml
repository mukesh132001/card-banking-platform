name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  account-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # The portal (Angular) job is added in milestone M2, once portal/package.json exists.
