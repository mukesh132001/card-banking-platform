name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  account-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  alerts-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerts-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Switch to `npm ci` (and add cache: npm) once alerts-ui/package-lock.json is committed.
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  # The portal (Angular) job is added in milestone M2, once portal/package.json exists.
