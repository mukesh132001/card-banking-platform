server:
  port: 8080

spring:
  application:
    name: account-service
  # Default: in-memory H2 in PostgreSQL mode, so the service runs with no Docker.
  # Use the "postgres" profile for a real PostgreSQL (docker compose up -d at the repo root).
  datasource:
    url: jdbc:h2:mem:accounts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
  flyway:
    locations: classpath:db/migration,classpath:db/demo   # db/demo = demo customers and transactions

security:
  jwt:
    # HS256 key: at least 32 bytes. The default is for local development only; set JWT_SECRET anywhere shared.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    issuer: card-banking-platform/account-service
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  login:
    max-failed-attempts: 5
    lock-duration: 15m

app:
  # Creates demo logins (see README) at startup if they don't exist. Turn off in any real environment.
  demo-users: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/bank
    username: bank
    password: bank
