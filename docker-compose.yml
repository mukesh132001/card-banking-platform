# Local PostgreSQL for the account service:  docker compose up -d
# Then run the service with:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank   # local development only
    ports:
      - "5432:5432"
    volumes:
      - bank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bank-data:
